name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: System deps
        run: |
          sudo apt-get update
          # Set completo Buildozer/p4a (Ubuntu 22.04) + extras que suelen faltar en CI
          sudo apt-get install -y \
            build-essential ccache cmake ninja-build pkg-config \
            git zip unzip patch wget curl \
            openjdk-17-jdk \
            autoconf automake autopoint gettext libtool libltdl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev liblzma-dev libbz2-dev \
            libsqlite3-dev libjpeg-dev libpng-dev libfreetype6-dev \
            lld gfortran
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "Cython==0.29.37" virtualenv

      - name: Build debug APK
        run: |
          source .venv/bin/activate
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer-ci.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-ci-log
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesAnalytics-Android-APK
          path: bin/*.apk
          if-no-files-found: error
