name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Build debug APK
        run: |
          source .venv/bin/activate
          # VIRTUAL_ENV ya activo: evita el fallo clásico de pip --user
          buildozer -v android debug 2>&1 | tee buildozer-ci.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-ci-log
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesAnalytics-Android-APK
          path: bin/*.apk
          if-no-files-found: error
